version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing backend dependencies"
      - npm ci

  pre_build:
    commands:
      - echo "Running backend validation"
      - npm test

  build:
    commands:
      - echo "Backend build completed"
      - echo "Build number ${CODEBUILD_BUILD_NUMBER:-local}"

artifacts:
  files:
    - server.js
    - package.json
    - package-lock.json
    - appspec.yml
    - cicd-backend.service
    - scripts/**/*
  discard-paths: no